name: Build and deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jeylu-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            erickaguilarwda/jeylu-backend:prod
            erickaguilarwda/jeylu-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=jeylu-backend
          cache-to: type=gha,mode=max,scope=jeylu-backend

      - name: Deploy backend to OVH VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/jeylu && BACKEND_TAG=prod docker compose --env-file .env -f docker-compose.prod.yml pull backend && BACKEND_TAG=prod docker compose --env-file .env -f docker-compose.prod.yml run --rm --no-deps backend php artisan migrate --force && BACKEND_TAG=prod docker compose --env-file .env -f docker-compose.prod.yml up -d --no-deps backend'
